<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#10162b"><title>Rem Clicker 💙</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#f2f5ff;background:#0b1021}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 25% 15%,#233f73 0,transparent 40%),radial-gradient(circle at 90% 70%,#30265e 0,transparent 40%),#0b1021;min-height:100vh}button{font:inherit;cursor:pointer}header{padding:18px 28px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff22;gap:10px;flex-wrap:wrap}h1{margin:0;font-size:1.4rem;color:#bce8ff}.muted{color:#aebad4}.layout{display:grid;grid-template-columns:1fr minmax(300px,420px);max-width:1250px;margin:auto;gap:22px;padding:24px}.panel{background:#131c35dd;border:1px solid #8bbcff33;border-radius:24px;box-shadow:0 20px 55px #0004}.game{text-align:center;padding:35px 18px;position:relative;overflow:hidden;min-height:650px}.score{font-size:clamp(2rem,5vw,3.7rem);font-weight:850;margin:15px 0 2px}.rate{color:#a6dbff}.character{width:min(320px,76vw);height:min(320px,76vw);border:0;background:radial-gradient(circle,#75c6ff66,#4d7af41c 62%,transparent 70%);display:grid;place-items:center;margin:35px auto 15px;position:relative;touch-action:manipulation;transition:transform .1s;user-select:none;-webkit-tap-highlight-color:transparent}.character:active{transform:scale(.92)}.character img{width:95%;height:95%;object-fit:contain;filter:drop-shadow(0 18px 25px #0008);pointer-events:none}.placeholder{font-size:125px;filter:drop-shadow(0 12px 20px #62baff88)}.hint{font-size:.9rem;color:#a9b7d4}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.pill{background:#24365d;color:#fff;border:1px solid #719bd366;border-radius:30px;padding:10px 16px}.pill:hover,.buy:hover{background:#344e82}.shop{padding:24px}.shop h2{margin:0 0 8px}.shop h3{margin:24px 0 12px}.buy{display:flex;align-items:center;justify-content:space-between;width:100%;padding:15px 12px;margin:10px 0;text-align:left;background:#202d4d;border:1px solid #5c7db755;border-radius:14px;color:white;gap:12px}.buy:disabled{opacity:.45;cursor:not-allowed}.buy strong{display:block}.buy small{color:#b3c3df}.price{white-space:nowrap;color:#a7e6ff;font-weight:700}.float{position:absolute;pointer-events:none;font-weight:900;color:#b5eaff;text-shadow:0 2px 8px #000;animation:fly .85s forwards}@keyframes fly{to{transform:translateY(-100px);opacity:0}}.toast{min-height:26px;color:#bce8ff;margin-top:10px}.footer{font-size:.8rem;text-align:center;padding:15px;color:#aab7ce}input[type=file]{display:none}@media(max-width:850px){.layout{grid-template-columns:1fr;padding:12px}.game{min-height:530px;padding:20px 10px}.shop{padding:18px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body>
<header><h1>💙 REM CLICKER</h1><div class="actions"><button class="pill" id="mute" aria-pressed="false">🔊 Sound on</button><button class="pill" id="save">💾 Save</button></div></header>
<main class="layout"><section class="panel game"><div class="muted">Your Rem points</div><div class="score" id="score">0</div><div class="rate" id="rate">0 per second</div><button class="character" id="clicker" aria-label="Click Rem to earn points"><img id="remImage" src="assets/rem.png" alt="Rem character" hidden><span class="placeholder" id="placeholder">💙</span></button><div class="hint">Tap Rem to earn points! Every click counts.</div><div class="actions" style="margin-top:20px"><label class="pill" for="imageUpload" tabindex="0">🖼️ Choose Rem image</label><input id="imageUpload" type="file" accept="image/*"><button class="pill" id="reset">↻ Reset progress</button></div><div class="toast" id="toast" aria-live="polite"></div></section>
<aside class="panel shop"><h2>✨ Upgrade Shop</h2><div class="muted">Build your Rem empire!</div><div id="shop"></div><h3>🏆 Achievements</h3><div id="achievements" class="muted"></div><h3>📊 Statistics</h3><div id="stats" class="muted"></div></aside></main>
<div class="footer">Fan-made clicker game • Save data stays in your browser • Add your own image and sound assets</div>
<audio id="clickAudio" src="assets/guragura.mp3" preload="auto"></audio>
<script>
'use strict';
const KEY='rem-clicker-v1';
const upgrades=[
{id:'finger',name:'💙 Stronger Clicks',description:'+1 point per click',base:15,scale:1.5,click:1},
{id:'maid',name:'🧹 Maid Helpers',description:'+1 point per second',base:30,scale:1.17,cps:1},
{id:'tea',name:'🍵 Tea Service',description:'+5 points per second',base:180,scale:1.18,cps:5},
{id:'mansion',name:'🏰 Roswaal Mansion',description:'+25 points per second',base:1200,scale:1.2,cps:25},
{id:'spirit',name:'✨ Spirit Blessing',description:'+100 points per second',base:8500,scale:1.22,cps:100},
{id:'legend',name:'🌟 Legendary Rem',description:'+1000 points per second',base:75000,scale:1.25,cps:1000}
];
const milestones=[['First Love',1],['Rem Fan',100],['Dedicated',1000],['Mansion Royalty',10000],['Rem Forever',100000],['Legendary',1000000]];
let state={points:0,total:0,clicks:0,owned:{},muted:false,last:Date.now()};
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&typeof saved==='object'){state={...state,...saved,owned:saved.owned||{}}}}catch{}
for(const k of ['points','total','clicks','last'])if(!Number.isFinite(state[k])||state[k]<0)state[k]=0;
for(const u of upgrades)state.owned[u.id]=Math.max(0,Math.min(10000,Math.floor(Number(state.owned[u.id])||0)));
const $=id=>document.getElementById(id);
const fmt=n=>Math.floor(n).toLocaleString('en-US');
const cps=()=>upgrades.reduce((n,u)=>n+(u.cps||0)*state.owned[u.id],0);
const perClick=()=>1+upgrades.reduce((n,u)=>n+(u.click||0)*state.owned[u.id],0);
const price=u=>Math.ceil(u.base*Math.pow(u.scale,state.owned[u.id]));
function save(){state.last=Date.now();try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}
function toast(s){$('toast').textContent=s;clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').textContent='',2500)}
function render(){ $('score').textContent=fmt(state.points);$('rate').textContent=fmt(cps())+' per second • '+fmt(perClick())+' per click';$('mute').textContent=state.muted?'🔇 Sound off':'🔊 Sound on';$('mute').setAttribute('aria-pressed',String(state.muted));$('shop').innerHTML='';for(const u of upgrades){const b=document.createElement('button');b.className='buy';b.disabled=state.points<price(u);const left=document.createElement('span');const title=document.createElement('strong');title.textContent=u.name+' (×'+state.owned[u.id]+')';const desc=document.createElement('small');desc.textContent=u.description;left.append(title,desc);const cost=document.createElement('span');cost.className='price';cost.textContent=fmt(price(u))+' 💙';b.append(left,cost);b.addEventListener('click',()=>{const p=price(u);if(state.points<p)return;state.points-=p;state.owned[u.id]++;save();render()});$('shop').append(b)}$('achievements').textContent=milestones.filter(m=>state.total>=m[1]).map(m=>'🏅 '+m[0]).join(' • ')||'Keep clicking to unlock achievements!';$('stats').textContent='Total earned: '+fmt(state.total)+' • Clicks: '+fmt(state.clicks)}
function playClick(){if(state.muted)return;const a=$('clickAudio');if(a.readyState>=2){try{const s=a.cloneNode();s.volume=.35;s.play().catch(()=>{});s.addEventListener('ended',()=>s.remove(),{once:true})}catch{}}}
$('clicker').addEventListener('click',e=>{const n=perClick();state.points+=n;state.total+=n;state.clicks++;playClick();const el=document.createElement('span');el.className='float';el.textContent='+'+fmt(n)+' 💙';const r=$('clicker').getBoundingClientRect();el.style.left=(e.clientX-r.left)+'px';el.style.top=(e.clientY-r.top)+'px';$('clicker').append(el);setTimeout(()=>el.remove(),850);render()});
$('mute').onclick=()=>{state.muted=!state.muted;save();render()};
$('save').onclick=()=>{save();toast('Progress saved! 💾')};
$('reset').onclick=()=>{if(!confirm('Reset all Rem Clicker progress?'))return;state={points:0,total:0,clicks:0,owned:Object.fromEntries(upgrades.map(u=>[u.id,0])),muted:state.muted,last:Date.now()};save();render();toast('Progress reset')};
$('imageUpload').onchange=e=>{const f=e.target.files?.[0];if(!f||!f.type.startsWith('image/'))return;const img=$('remImage');img.src=URL.createObjectURL(f);img.hidden=false;$('placeholder').hidden=true;toast('Image loaded for this session!')};
$('remImage').onload=()=>{$('remImage').hidden=false;$('placeholder').hidden=true};
$('remImage').onerror=()=>{$('remImage').hidden=true;$('placeholder').hidden=false};
document.querySelector('label[for=imageUpload]').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('imageUpload').click()}};
const elapsed=Math.min(Math.max((Date.now()-state.last)/1000,0),8*3600);if(elapsed>5&&cps()>0){const earned=elapsed*cps();state.points+=earned;state.total+=earned;toast('Welcome back! Offline earnings: '+fmt(earned)+' 💙')}
let previous=Date.now();setInterval(()=>{const now=Date.now();const dt=Math.min((now-previous)/1000,10);previous=now;const earned=cps()*dt;state.points+=earned;state.total+=earned;render()},250);
setInterval(save,10000);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});window.addEventListener('pagehide',save);render();
</script></body></html>
