<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#15192e" />
    <title>Rem Clicker 💙</title>
    <link rel="stylesheet" href="game.css" />
    <script defer src="game.js"></script>
  </head>
  <body>
    <header>
      <b><i>✧</i> Rem Clicker</b>
      <div>
        <button id="mute">Sound on</button> <button id="save">Save</button>
      </div>
    </header>
    <nav aria-label="Game screens"></nav>
    <main>
      <section id="Home">
        <div class="hero">
          <div class="scene">
            <div class="stars"></div>
            <div class="label">ROSwAAL ESTATE</div>
            <h1>Moonlit garden</h1>
            <div class="orbit">
              <button id="tap" aria-label="Tap Rem">
                <img id="portrait" src="1000014349.jpg" alt="Rem" />
              </button>
            </div>
            <button id="event" hidden></button><small id="titleRank"></small>
            <p id="hint">Tap Rem to earn hearts</p>
          </div>
          <article>
            <small>HEART BALANCE</small>
            <h2 id="balance">0</h2>
            <p id="rates"></p>
            <hr />
            <small>CLICK COMBO</small>
            <h3 id="combo"></h3>
            <progress id="meter" max="30"></progress>
            <hr />
            <small>GARDEN JOURNAL</small>
            <h3 id="quest"></h3>
            <button id="daily">Collect daily gift</button>
            <p id="buff"></p>
            <hr />
            <small>GARDEN CHALLENGE</small>
            <p id="challengeInfo"></p>
            <button id="challenge">Start challenge</button>
          </article>
        </div>
      </section>
      <section id="market" hidden>
        <h1 id="marketTitle"></h1>
        <div class="tools">
          <input
            id="search"
            placeholder="Search upgrades"
            aria-label="Search upgrades"
          /><select id="quantity" aria-label="Purchase quantity">
            <option>1</option>
            <option>10</option>
            <option>100</option>
            <option>Max</option>
          </select>
        </div>
        <div id="catalog"></div>
      </section>
      <section id="Achievements" hidden>
        <h1>Achievement archive</h1>
        <p id="completion"></p>
        <div class="grid" id="badges"></div>
      </section>
      <section id="Prestige" hidden>
        <h1>Crystal sanctuary</h1>
        <article>
          <h2 id="crystals"></h2>
          <p id="rebirthInfo"></p>
          <button id="rebirth">Begin rebirth</button>
        </article>
        <div class="grid" id="tree"></div>
      </section>
      <section id="Statistics" hidden>
        <h1>Estate records</h1>
        <div class="grid" id="records"></div>
        <h3>Hearts per second · recent history</h3>
        <canvas id="chart" width="620" height="90"></canvas>
      </section>
      <section id="Settings" hidden>
        <h1>Settings</h1>
        <div class="grid" id="options"></div>
        <article class="tools">
          <button id="backup">Export save</button
          ><label
            >Import save<input type="file" id="restore" accept=".json" /></label
          ><label
            >Choose Rem image<input
              type="file"
              id="upload"
              accept="image/*" /></label
          ><button id="reset">Reset progress</button>
        </article>
      </section>
    </main>
    <aside id="notice" role="status"></aside>
    <dialog>
      <h2>Welcome back</h2>
      <p id="away"></p>
      <button onclick="this.closest('dialog').close()">Return to garden</button>
    </dialog>
    <audio id="voice" preload="auto" src="goro.wav"></audio>
  </body>
</html>
